# Pilot basin — La Laignes à Molesme (Hub'Eau site H0203020)
# basin_area_km2 source: Hub'Eau referentiel/sites field surface_bv (615 km², retrieved 2026-08-23)
# Before final demo: confirm calibration/validation cover diverse hydrological conditions (spec §3).

station:
  code: "H0203020"
  name: "La Laignes à Molesme"
  basin_area_km2: 615.0
  centroid_lat: 47.961780
  centroid_lon: 4.361000

data:
  meteo_timezone: "Europe/Paris"

periods:
  warmup: ["2010-01-01", "2010-12-31"]
  calibration: ["2011-01-01", "2013-12-31"]
  validation: ["2014-01-01", "2015-12-31"]

model:
  name: "GR4J"
  parameter_bounds:
    X1: [100, 1200]
    X2: [-5, 3]
    X3: [20, 300]
    X4: [1.1, 2.9]

calibration:
  sampler: "latin_hypercube"
  n_samples: 5000
  seed: 42
  behavioral_kge_threshold: 0.80

metrics:
  log_nse_epsilon_mm: 0.01

# Phase 8E — synthetic meteorological forcing sensitivity (NOT a weather-forecast benchmark).
# Parameters are architectural controls only; they are never tuned to hydrological metrics.
meteo_sensitivity:
  n_realizations: 100
  seed: 42
  wet_day_threshold_mm: 1.0
  moderate:
    magnitude_lognormal_sigma: 0.20
    timing_shift_probability: 0.10
    miss_probability: 0.05
    miss_factor: 0.20
    false_alarm_probability: 0.05
    false_alarm_mm: 1.5
  strong:
    magnitude_lognormal_sigma: 0.40
    timing_shift_probability: 0.25
    miss_probability: 0.15
    miss_factor: 0.10
    false_alarm_probability: 0.12
    false_alarm_mm: 3.0

# Phase 9 — forecast uncertainty calibration (pre-validation fitting only).
uncertainty:
  train_fraction: 0.75
  rolling_coverage_window_days: 60
  top_n_extreme_events: 10
  moderate_realization: 0
  meteo_scenarios: ["oracle", "moderate"]

# Optional presentation metadata for the static interview demo.
# If unset, `python run.py --export-demo` uses the detected git origin URL when available.
demo:
  github_url: null
